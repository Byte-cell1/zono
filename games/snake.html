<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake | Zono</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #050507;
            --bg-card: #131318;
            --text-main: #ffffff;
            --text-muted: #8b8b93;
            --primary: #ccff00;
            --primary-glow: rgba(204,255,0,.4);
            --accent-red: #ff3366;
            --font-heading: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-dark); color: var(--text-main); font-family: var(--font-body);
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            overflow: hidden;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(204,255,0,.05), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255,51,102,.05), transparent 40%);
        }
        header {
            width: 100%; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,.05);
        }
        .back-link { color: var(--text-muted); text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: color .2s; }
        .back-link:hover { color: var(--primary); }
        .title { font-family: var(--font-heading); color: var(--primary); font-size: 1.5rem; letter-spacing: 2px; }
        .hud {
            display: flex; gap: 30px; padding: 20px;
            font-family: var(--font-heading); font-size: 1rem;
        }
        .hud-item { text-align: center; }
        .hud-item small { display: block; color: var(--text-muted); font-family: var(--font-body); font-size: .75rem; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
        .hud-item strong { color: var(--primary); font-size: 1.6rem; text-shadow: 0 0 10px var(--primary-glow); }
        .canvas-wrap {
            position: relative; background: #0a0a10; border: 2px solid rgba(204,255,0,.2);
            border-radius: 12px; box-shadow: 0 0 40px rgba(204,255,0,.15), inset 0 0 40px rgba(0,0,0,.8);
        }
        canvas { display: block; border-radius: 10px; }
        .overlay {
            position: absolute; inset: 0; background: rgba(5,5,7,.9); backdrop-filter: blur(6px);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px;
            border-radius: 10px; text-align: center; padding: 20px;
        }
        .overlay.hidden { display: none; }
        .overlay h2 { font-family: var(--font-heading); color: var(--primary); font-size: 2rem; margin-bottom: 5px; }
        .overlay p { color: var(--text-muted); font-size: 1rem; max-width: 300px; }
        .overlay .big-score { font-family: var(--font-heading); font-size: 3rem; color: #fff; margin: 10px 0; }
        .btn-primary {
            background: var(--primary); color: #000; border: none; padding: 14px 32px;
            font-family: var(--font-heading); font-weight: 700; font-size: 1rem; border-radius: 8px;
            cursor: pointer; transition: all .2s; box-shadow: 0 0 20px var(--primary-glow);
        }
        .btn-primary:hover { background: #b3e600; transform: translateY(-2px); box-shadow: 0 0 30px var(--primary-glow); }
        .btn-secondary {
            background: transparent; color: var(--text-main); border: 1px solid rgba(255,255,255,.2);
            padding: 12px 24px; font-family: var(--font-heading); font-weight: 700; border-radius: 8px;
            cursor: pointer; text-decoration: none; transition: all .2s;
        }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
        .controls-hint { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: var(--text-muted); font-size: .85rem; text-align: center; }
        .controls-hint kbd { background: rgba(255,255,255,.1); padding: 2px 6px; border-radius: 4px; margin: 0 2px; font-family: monospace; }
        .mobile-dpad { display: none; }
        @media (max-width: 768px) {
            canvas { max-width: 90vw; height: auto; }
            .hud { gap: 15px; font-size: .9rem; }
            .controls-hint { display: none; }
            .mobile-dpad { display: grid; grid-template-columns: repeat(3, 60px); gap: 8px; margin-top: 20px; }
            .mobile-dpad button {
                background: rgba(204,255,0,.1); border: 1px solid rgba(204,255,0,.3); color: var(--primary);
                width: 60px; height: 60px; border-radius: 10px; font-size: 1.5rem; cursor: pointer;
            }
            .mobile-dpad button:active { background: var(--primary); color: #000; }
            .mobile-dpad .up { grid-column: 2; }
            .mobile-dpad .left { grid-column: 1; grid-row: 2; }
            .mobile-dpad .down { grid-column: 2; grid-row: 2; }
            .mobile-dpad .right { grid-column: 3; grid-row: 2; }
        }
    </style>
</head>
<body>
    <header>
        <a href="../dashboard.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back</a>
        <div class="title">NEON SNAKE</div>
        <div style="width: 60px;"></div>
    </header>

    <div class="hud">
        <div class="hud-item"><small>Score</small><strong id="score">0</strong></div>
        <div class="hud-item"><small>Best</small><strong id="best">0</strong></div>
        <div class="hud-item"><small>Speed</small><strong id="speed">1</strong></div>
    </div>

    <div class="canvas-wrap">
        <canvas id="game" width="480" height="480"></canvas>
        <div class="overlay" id="overlay">
            <h2>NEON SNAKE</h2>
            <p>Use arrow keys or WASD to move. Eat the neon pellets to grow. Don't hit yourself or the walls.</p>
            <button class="btn-primary" id="start-btn">Start Game</button>
        </div>
    </div>

    <div class="mobile-dpad">
        <button class="up" data-dir="up"><i class="fa-solid fa-chevron-up"></i></button>
        <button class="left" data-dir="left"><i class="fa-solid fa-chevron-left"></i></button>
        <button class="down" data-dir="down"><i class="fa-solid fa-chevron-down"></i></button>
        <button class="right" data-dir="right"><i class="fa-solid fa-chevron-right"></i></button>
    </div>

    <div class="controls-hint">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> to move · <kbd>Space</kbd> to pause
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import {
            getFirestore, doc, getDoc, updateDoc, collection, addDoc, serverTimestamp, increment, query, where, getDocs, orderBy, limit
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCCbplkXSNKD624BIfE5jzVyiSXXKuNhh8",
            authDomain: "zonoco.firebaseapp.com",
            projectId: "zonoco",
            storageBucket: "zonoco.firebasestorage.app",
            messagingSenderId: "157338128433",
            appId: "1:157338128433:web:52e35cf7483d5d65cec510",
            measurementId: "G-GCH7HHM66Q"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const speedEl = document.getElementById('speed');

        const GRID = 24;
        const CELL = canvas.width / GRID;

        let snake, dir, nextDir, food, score, speedLevel, interval, gameLoop, running, paused, currentUser;
        let bestScore = 0;

        // --- Auth ---
        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "../login.html"; return; }
            currentUser = user;
            // Load best score for this user
            const snap = await getDoc(doc(db, 'users', user.uid));
            if (snap.exists()) bestScore = snap.data().snakeBest || 0;
            bestEl.textContent = bestScore;
        });

        // --- Game setup ---
        function reset() {
            snake = [{x: 10, y: 12}, {x: 9, y: 12}, {x: 8, y: 12}];
            dir = {x: 1, y: 0};
            nextDir = {x: 1, y: 0};
            score = 0;
            speedLevel = 1;
            spawnFood();
            scoreEl.textContent = 0;
            speedEl.textContent = 1;
        }

        function spawnFood() {
            while (true) {
                const f = {x: Math.floor(Math.random()*GRID), y: Math.floor(Math.random()*GRID)};
                if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; return; }
            }
        }

        function draw() {
            // Background grid
            ctx.fillStyle = '#0a0a10';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(204,255,0,.04)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID; i++) {
                ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i*CELL); ctx.lineTo(canvas.width, i*CELL); ctx.stroke();
            }

            // Food
            ctx.shadowBlur = 20; ctx.shadowColor = '#ff3366';
            ctx.fillStyle = '#ff3366';
            ctx.beginPath();
            ctx.arc(food.x*CELL + CELL/2, food.y*CELL + CELL/2, CELL*0.35, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Snake
            snake.forEach((seg, i) => {
                const isHead = i === 0;
                const t = 1 - i / snake.length;
                ctx.shadowBlur = isHead ? 20 : 10;
                ctx.shadowColor = '#ccff00';
                ctx.fillStyle = isHead ? '#ccff00' : `rgba(204,255,0,${0.4 + t * 0.5})`;
                const pad = isHead ? 1 : 2;
                roundRect(seg.x*CELL + pad, seg.y*CELL + pad, CELL - pad*2, CELL - pad*2, 4);
                ctx.fill();
            });
            ctx.shadowBlur = 0;
        }

        function roundRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x+r, y);
            ctx.arcTo(x+w, y, x+w, y+h, r);
            ctx.arcTo(x+w, y+h, x, y+h, r);
            ctx.arcTo(x, y+h, x, y, r);
            ctx.arcTo(x, y, x+w, y, r);
            ctx.closePath();
        }

        function tick() {
            if (!running || paused) return;
            dir = nextDir;
            const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

            // Wall collision
            if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) { endGame(); return; }
            // Self collision
            if (snake.some(s => s.x === head.x && s.y === head.y)) { endGame(); return; }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                spawnFood();
                // Speed up every 5 foods (50 pts)
                if (score > 0 && score % 50 === 0) {
                    speedLevel++;
                    speedEl.textContent = speedLevel;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(tick, Math.max(60, 150 - speedLevel*10));
                }
            } else {
                snake.pop();
            }

            draw();
        }

        async function endGame() {
            running = false;
            clearInterval(gameLoop);

            // Save to Firestore
            if (currentUser) {
                try {
                    const userRef = doc(db, 'users', currentUser.uid);
                    const isWin = score > 50;
                    await updateDoc(userRef, {
                        gamesPlayed: increment(1),
                        xp: increment(10 + Math.floor(score / 10)),
                        wins: increment(isWin ? 1 : 0),
                        snakeBest: Math.max(bestScore, score)
                    });
                    await addDoc(collection(db, 'gameResults'), {
                        gameId: 'snake',
                        uid: currentUser.uid,
                        score,
                        duration: 0,
                        mode: 'single-player',
                        createdAt: serverTimestamp()
                    });
                    if (score > bestScore) { bestScore = score; bestEl.textContent = bestScore; }
                } catch (e) { console.error('Save failed', e); }
            }

            overlay.classList.remove('hidden');
            overlay.innerHTML = `
                <h2>GAME OVER</h2>
                <p>Your final score</p>
                <div class="big-score">${score}</div>
                <p>${score > bestScore - 1 && score > 0 ? 'New best!' : `Best: ${bestScore}`}</p>
                <div style="display:flex;gap:10px;margin-top:15px;">
                    <button class="btn-primary" id="again-btn">Play Again</button>
                    <a href="../dashboard.html" class="btn-secondary">Back to Dashboard</a>
                </div>
            `;
            document.getElementById('again-btn').addEventListener('click', startGame);
        }

        function startGame() {
            overlay.classList.add('hidden');
            reset();
            draw();
            running = true;
            paused = false;
            speedLevel = 1;
            clearInterval(gameLoop);
            gameLoop = setInterval(tick, 150);
        }

        // --- Input ---
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (['arrowup','w'].includes(k) && dir.y === 0) nextDir = {x:0,y:-1};
            else if (['arrowdown','s'].includes(k) && dir.y === 0) nextDir = {x:0,y:1};
            else if (['arrowleft','a'].includes(k) && dir.x === 0) nextDir = {x:-1,y:0};
            else if (['arrowright','d'].includes(k) && dir.x === 0) nextDir = {x:1,y:0};
            else if (k === ' ') { paused = !paused; e.preventDefault(); }
            else if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
        });

        // Mobile D-pad
        document.querySelectorAll('.mobile-dpad button').forEach(btn => {
            btn.addEventListener('click', () => {
                const d = btn.dataset.dir;
                if (d === 'up' && dir.y === 0) nextDir = {x:0,y:-1};
                if (d === 'down' && dir.y === 0) nextDir = {x:0,y:1};
                if (d === 'left' && dir.x === 0) nextDir = {x:-1,y:0};
                if (d === 'right' && dir.x === 0) nextDir = {x:1,y:0};
            });
        });

        document.getElementById('start-btn').addEventListener('click', startGame);

        // Initial draw
        reset(); draw();
    </script>
</body>
</html>
