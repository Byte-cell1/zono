<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zono | Match Lobby</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #050507; --bg-card: #131318; --text-main: #fff; --text-muted: #8b8b93;
            --primary: #ccff00; --primary-glow: rgba(204,255,0,.4); --accent-red: #ff3366;
            --font-heading: 'Orbitron', sans-serif; --font-body: 'Rajdhani', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-dark); color: var(--text-main); font-family: var(--font-body);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(204,255,0,.06), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255,51,102,.06), transparent 40%);
        }
        .lobby {
            background: var(--bg-card); border: 1px solid rgba(255,255,255,.08);
            border-radius: 16px; padding: 40px; max-width: 560px; width: 90%;
            text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.5);
        }
        h1 { font-family: var(--font-heading); color: var(--primary); font-size: 1.6rem; letter-spacing: 2px; margin-bottom: 8px; }
        .subtitle { color: var(--text-muted); margin-bottom: 30px; font-size: .9rem; }
        .game-badge {
            display: inline-block; padding: 6px 14px; border-radius: 20px;
            background: rgba(204,255,0,.1); border: 1px solid rgba(204,255,0,.3);
            color: var(--primary); font-family: var(--font-heading);
            font-size: .8rem; letter-spacing: 1px; margin-bottom: 30px;
        }
        .players-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px; align-items: center; margin-bottom: 30px; }
        .player-card {
            background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08);
            border-radius: 12px; padding: 20px; transition: all .3s;
        }
        .player-card.me { border-color: rgba(204,255,0,.4); }
        .player-card.ready { border-color: #00ff88; box-shadow: 0 0 20px rgba(0,255,136,.2); }
        .player-avatar { width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 10px; overflow: hidden; border: 2px solid var(--primary); }
        .player-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .player-avatar .avatar-initial { width: 100%; height: 100%; background: var(--primary); color: #000; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.5rem; font-family: var(--font-heading); }
        .player-name { font-weight: 700; font-size: 1.05rem; }
        .player-status { font-size: .8rem; color: var(--text-muted); margin-top: 4px; }
        .player-status.ready { color: #00ff88; }
        .vs { font-family: var(--font-heading); font-size: 1.8rem; color: var(--text-muted); }
        .btn-ready {
            background: var(--primary); color: #000; border: none; padding: 16px 40px;
            font-family: var(--font-heading); font-weight: 700; font-size: 1rem; border-radius: 10px;
            cursor: pointer; transition: all .2s; box-shadow: 0 0 20px var(--primary-glow);
        }
        .btn-ready:hover { background: #b3e600; transform: translateY(-2px); }
        .btn-ready:disabled { opacity: .5; cursor: not-allowed; transform: none; }
        .btn-ready.ready-state { background: #00ff88; box-shadow: 0 0 20px rgba(0,255,136,.4); }
        .btn-leave {
            display: block; margin-top: 20px; color: var(--text-muted);
            text-decoration: none; font-size: .9rem;
        }
        .btn-leave:hover { color: var(--accent-red); }
        .waiting-text { color: var(--text-muted); font-style: italic; margin-top: 20px; display: none; }
    </style>
</head>
<body>
    <div class="lobby">
        <h1>MATCH LOBBY</h1>
        <p class="subtitle">Waiting for both players to ready up</p>
        <div class="game-badge" id="game-badge">GAME</div>
        <div class="players-grid">
            <div class="player-card" id="player-1">
                <div class="player-avatar"></div>
                <div class="player-name">Player 1</div>
                <div class="player-status">Loading…</div>
            </div>
            <div class="vs">VS</div>
            <div class="player-card" id="player-2">
                <div class="player-avatar"></div>
                <div class="player-name">Player 2</div>
                <div class="player-status">Loading…</div>
            </div>
        </div>
        <button class="btn-ready" id="ready-btn">I'M READY</button>
        <p class="waiting-text" id="waiting-text">Waiting for opponent to ready up…</p>
        <a href="../dashboard.html" class="btn-leave">Leave lobby</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, onSnapshot, serverTimestamp, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCCbplkXSNKD624BIfE5jzVyiSXXKuNhh8",
            authDomain: "zonoco.firebaseapp.com", projectId: "zonoco",
            storageBucket: "zonoco.firebasestorage.app",
            messagingSenderId: "157338128433",
            appId: "1:157338128433:web:52e35cf7483d5d65cec510",
            measurementId: "G-GCH7HHM66Q"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const params = new URLSearchParams(window.location.search);
        const matchId = params.get('match');
        if (!matchId) { window.location.href = '../dashboard.html'; }

        let currentUser = null;
        let myReady = false;
        let matchData = null;

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = '../login.html'; return; }
            currentUser = user;

            const matchRef = doc(db, 'matches', matchId);
            const snap = await getDoc(matchRef);
            if (!snap.exists()) { alert('Match not found'); window.location.href = '../dashboard.html'; return; }

            onSnapshot(matchRef, async (s) => {
                matchData = s.data();
                document.getElementById('game-badge').textContent = (matchData.gameId || 'GAME').toUpperCase();

                const [p1, p2] = matchData.players;
                const [s1, s2] = await Promise.all([
                    getDoc(doc(db, 'users', p1)),
                    getDoc(doc(db, 'users', p2))
                ]);
                const readyList = matchData.ready || [];

                renderPlayer('player-1', s1.data(), p1 === currentUser.uid, readyList.includes(p1));
                renderPlayer('player-2', s2.data(), p2 === currentUser.uid, readyList.includes(p2));

                // When both ready → navigate to the game
                if (readyList.length === 2 && matchData.status === 'active') {
                    const isFirstTime = !matchData.startedAt;
                    if (isFirstTime) {
                        await updateDoc(matchRef, { startedAt: serverTimestamp() });
                    }
                    window.location.href = `tictactoe.html?match=${matchId}`;
                }
            });
        });

        function renderPlayer(id, data, isMe, isReady) {
            const card = document.getElementById(id);
            if (!data) return;
            card.className = `player-card${isMe ? ' me' : ''}${isReady ? ' ready' : ''}`;
            const name = data.displayName || data.email || 'Player';
            const avatarHtml = data.photoURL
                ? `<img src="${data.photoURL}" alt="">`
                : `<div class="avatar-initial">${name.charAt(0).toUpperCase()}</div>`;
            card.innerHTML = `
                <div class="player-avatar">${avatarHtml}</div>
                <div class="player-name">${name} ${isMe ? '(You)' : ''}</div>
                <div class="player-status${isReady ? ' ready' : ''}">${isReady ? '✓ Ready' : 'Not ready'}</div>
            `;
        }

        document.getElementById('ready-btn').addEventListener('click', async () => {
            if (myReady) return;
            const matchRef = doc(db, 'matches', matchId);
            await updateDoc(matchRef, {
                ready: arrayUnion(currentUser.uid)
            });
            myReady = true;
            const btn = document.getElementById('ready-btn');
            btn.textContent = 'READY ✓';
            btn.classList.add('ready-state');
            btn.disabled = true;
            document.getElementById('waiting-text').style.display = 'block';
        });
    </script>
</body>
</html>
